server {
    listen 80;
    server_name _;
    client_max_body_size 50m;

    # 阶段 2 接入前端静态文件时在这里加 root/try_files

    location /dp/ {
        proxy_pass http://data-plane-api:8100/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://fieldforge-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SSE 流式友好（tpa 后端接入后复用）
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
