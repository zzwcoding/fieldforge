# fieldforge 单机部署（阶段 1：一台云服务器 + Docker Compose）
# 用法：cd deploy && docker compose up -d --build
services:
  fieldforge-api:
    build:
      context: ..
      dockerfile: deploy/api/Dockerfile
    volumes:
      - ff-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme-on-first-boot}
      POSTGRES_DB: fieldforge
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - fieldforge-api
    restart: unless-stopped

  # S3：tpa 数据面只读查询面（/dp/ 前缀；代码在 /opt/tpa-data-plane）
  data-plane-api:
    build:
      context: /opt/tpa-data-plane
      dockerfile: deploy/Dockerfile
    environment:
      DP_RUN_DIR: /data/runs
    volumes:
      - ff-data:/data:ro
    restart: unless-stopped

  # S3：MinIO 对象存储（湖底座 S1 形状；内网 9000，控制台 9001 不对外）
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-fieldforge}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme-on-first-boot}
    volumes:
      - minio-data:/data
    restart: unless-stopped

volumes:
  ff-data:
  pgdata:
  minio-data:
