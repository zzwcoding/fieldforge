# fieldforge 单机部署（阶段 1：一台云服务器 + Docker Compose）
# 用法：cd deploy && docker compose up -d --build
services:
  fieldforge-api:
    build:
      context: ..
      dockerfile: deploy/api/Dockerfile
    volumes:
      - ff-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme-on-first-boot}
      POSTGRES_DB: fieldforge
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - fieldforge-api
    restart: unless-stopped

  # S3：tpa 数据面只读查询面（/dp/ 前缀；代码在 /opt/tpa-data-plane）
  data-plane-api:
    build:
      context: /opt/tpa-data-plane
      dockerfile: deploy/Dockerfile
    environment:
      DP_RUN_DIR: /data/runs
    volumes:
      - ff-data:/data:ro
    restart: unless-stopped
  # S3 注记：MinIO 容器暂缓（各镜像源对本网络不可拉）——S1 数据面读 CSV 零依赖 MinIO，
  # Iceberg/PyIceberg 真链路（S2+）启用时再以可用镜像源补挂。

volumes:
  ff-data:
  pgdata:
